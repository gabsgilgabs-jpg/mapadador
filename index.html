<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Mapa Dor</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <!-- CABEÇALHO -->
  <header id="cabecalho">

    <h2>
      Mapa de Dor Corporal
    </h2>

    <p>
      Registro clínico de avaliação do paciente
    </p>

  </header>

  <!-- DADOS PACIENTE -->
  <div id="dadosPaciente">

    <input
      type="text"
      id="nome"
      placeholder="Nome do paciente"
    >

    <input
      type="date"
      id="dataPreenchimento"
    >

    <input
      type="text"
      id="assinatura"
      placeholder="Assinatura"
    >

  </div>

  <!-- MAPA -->
  <div id="containerPai">

    <div id="mapaContainer">

      <canvas id="canvasBase"></canvas>

      <canvas id="canvasPaint"></canvas>

      <div id="formulario"></div>

    </div>

  </div>

  <!-- BOTÕES -->
  <div class="botoes">

    <button
      id="btnParar"
      class="botaoAtivo"
      onclick="desativarModo()"
    >
      Parar desenho
    </button>

    <button
      id="btnPintar"
      onclick="definirModo('pintar')"
    >
      Pintar
    </button>

    <button
      id="btnApagar"
      onclick="definirModo('apagar')"
    >
      Apagar
    </button>

    <button onclick="limparTudo()">
      Limpar
    </button>

    <button onclick="zoomMais()">
      +
    </button>

    <button onclick="zoomMenos()">
      -
    </button>

    <button onclick="resetZoom()">
      100%
    </button>

  </div>

  <!-- OBSERVAÇÕES -->
  <section id="informacoes">

    <div class="blocoPergunta">

      <label>
        Obs.: indique com flechas os locais a que se referem o início (D)
        e a intensidade (I) das dores acima.
        Marque com um círculo o local da sua principal queixa de dor.
      </label>

    </div>

    <div class="blocoPergunta">

      <label>
        1. Descreva o que piora ou produz a sua dor:
      </label>

      <textarea></textarea>

    </div>

    <div class="blocoPergunta">

      <label>
        2. Descreva o que melhora a sua dor:
      </label>

      <textarea></textarea>

    </div>

    <div class="blocoPergunta">

      <label>
        3. A sua dor é constante?
      </label>

      <div class="opcoes">

        <label>
          <input
            type="radio"
            name="dorConstante"
          >
          Sim
        </label>

        <label>
          <input
            type="radio"
            name="dorConstante"
          >
          Não
        </label>

      </div>

    </div>

  </section>

  <!-- RODAPÉ -->
  <footer id="rodape">

    <div id="rodapeCampos">

      <input
        type="text"
        placeholder="Data"
      >

      <input
        type="text"
        placeholder="Nome"
      >

      <input
        type="text"
        placeholder="Assinatura"
      >

    </div>

    <div>
      Sistema de Avaliação de Dor • Registro clínico seguro
    </div>

  </footer>

  <!-- SCRIPTS -->
  <script src="script.js"></script>

</body>

</html>
