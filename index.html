<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Mapa Dor</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header id="cabecalho">
  <h2>Mapa de Dor Corporal</h2>
  <p>Registro clínico de avaliação do paciente</p>
</header>

<!-- DADOS DO PACIENTE -->
<div id="dadosPaciente">

  <input type="text" id="nome" placeholder="Nome do paciente">

  <input type="date" id="dataPreenchimento">

  <input type="text" id="assinatura" placeholder="Assinatura">

</div>

<div id="containerPai">

  <div id="mapaContainer">

    <canvas id="canvasBase"></canvas>
    <canvas id="canvasPaint"></canvas>

    <div id="formulario"></div>

  </div>

</div>

<div class="botoes">
  <button id="btnPintar" onclick="definirModo('pintar')">Pintar</button>
  <button id="btnApagar" onclick="definirModo('apagar')">Apagar</button>
  <button onclick="limparTudo()">Limpar</button>
  <button onclick="salvarPDF()">PDF</button>
</div>

<footer id="rodape">
  Sistema de Avaliação de Dor • Registro clínico seguro
</footer>

<script src="script.js"></script>

</body>
</html>
