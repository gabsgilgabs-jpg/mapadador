<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formulário de Dor</title>
  <link rel="stylesheet" href="style.css">
  <!-- Bibliotecas necessárias -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <!-- Campo para nome do paciente -->
  <div id="dados-paciente">
    <label for="nomePaciente">Nome do Paciente:</label>
    <input type="text" id="nomePaciente" placeholder="Digite o nome">
    <button onclick="salvarPDF()">Salvar PDF</button>
  </div>

  <!-- Área frente -->
  <div id="frente">
    <h2>Formulário - Frente</h2>
    <p>Observações:</p>
    <textarea id="observacoesFrente" placeholder="Digite suas observações"></textarea>

    <h3>Imagem para pintura (Pessoa - Frente)</h3>
    <canvas id="canvasFrente" width="400" height="600"></canvas>
  </div>

  <!-- Área costas -->
  <div id="costas">
    <h2>Formulário - Costas</h2>
    <p>Observações:</p>
    <textarea id="observacoesCostas" placeholder="Digite suas observações"></textarea>

    <h3>Imagem para pintura (Pessoa - Costas)</h3>
    <canvas id="canvasCostas" width="400" height="600"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
