<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mapa de Dor</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <!-- CABEÇALHO -->
  <header id="cabecalho">

    <h2>
      Mapa de Dor Corporal
    </h2>

    <p>
      Registro clínico de avaliação do paciente
    </p>

  </header>

  <!-- DADOS -->
  <div id="dadosPaciente">

    <input
      type="text"
      id="nome"
      placeholder="Nome do paciente"
      class="campoNome"
    >

    <input
      type="date"
      id="dataPreenchimento"
      class="campoData"
    >

    <input
      type="text"
      id="assinatura"
      placeholder="Assinatura"
      class="campoAssinatura"
    >

  </div>

  <!-- MAPA -->
  <div id="containerPai">

    <div id="mapaContainer">

      <canvas id="canvasBase"></canvas>

      <canvas id="canvasPaint"></canvas>

      <div id="formulario"></div>

    </div>

  </div>

  <!-- BOTÕES -->
  <div class="botoes">

    <button
      id="btnParar"
      class="botaoAtivo"
      onclick="desativarModo()"
    >
      Parar desenho
    </button>

    <button
      id="btnPintar"
      onclick="definirModo('pintar')"
    >
      Pintar
    </button>

    <button
      id="btnApagar"
      onclick="definirModo('apagar')"
    >
      Apagar
    </button>

    <button onclick="limparTudo()">
      Limpar
    </button>

    <button onclick="salvarPDF()">
      PDF
    </button>

    <button onclick="salvarGIF()">
      GIF
    </button>

    <button onclick="zoomMais()">
      +
    </button>

    <button onclick="zoomMenos()">
      -
    </button>

    <button onclick="resetZoom()">
      100%
    </button>

  </div>

  <!-- OBS -->
  <div id="observacoes">

    <p>
      Obs.: indique com flechas os locais a que se referem o início (D)
      e a intensidade (I) das dores acima.
      Marque com um círculo o local da sua principal queixa de dor.
    </p>

    <div class="pergunta">

      <label>
        1. Descreva o que piora ou produz a sua dor:
      </label>

      <textarea></textarea>

    </div>

    <div class="pergunta">

      <label>
        2. Descreva o que melhora a sua dor:
      </label>

      <textarea></textarea>

    </div>

    <div class="pergunta">

      <label>
        3. A sua dor é constante?
      </label>

      <div class="opcoes">

        <label>
          <input type="radio" name="dorConstante">
          Sim
        </label>

        <label>
          <input type="radio" name="dorConstante">
          Não
        </label>

      </div>

    </div>

  </div>

  <!-- RODAPÉ -->
  <footer id="rodape">

    <div class="rodapeCampos">

      <div>

        <label>Data:</label>

        <input type="date">

      </div>

      <div>

        <label>Nome:</label>

        <input type="text">

      </div>

      <div>

        <label>Assinatura:</label>

        <input type="text">

      </div>

    </div>

    <p>
      Sistema de Avaliação de Dor • Registro clínico seguro
    </p>

  </footer>

  <!-- SCRIPTS -->
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script src="script.js"></script>

</body>
</html>
