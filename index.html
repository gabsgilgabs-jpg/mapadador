<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formulário de Dor</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <div id="dados-paciente">
    <label for="nomePaciente">Nome do Paciente:</label>
    <input type="text" id="nomePaciente" placeholder="Digite o nome">
    <button onclick="salvarPDF()">Salvar PDF</button>
    <button onclick="resetZoomPan()">Resetar Zoom/Pan</button>
  </div>

  <div id="formulario">
    <h2>Formulário de Dor</h2>

    <label for="textoD">D:</label>
    <textarea id="textoD" placeholder="Digite observações para D:"></textarea>

    <label for="textoI">I:</label>
    <textarea id="textoI" placeholder="Digite observações para I:"></textarea>

    <h3>Imagem para pintura (Pessoa)</h3>
    <button onclick="modo='pintar'">Pintar</button>
    <button onclick="modo='apagar'">Borracha</button>
    <button onclick="limparCanvas()">Limpar tudo</button>
    <canvas id="canvasPessoa"></canvas>

    <h3>Lupa</h3>
    <canvas id="lupaCanvas" width="200" height="200"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
