<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formulário de Dor Interativo</title>
  <style>
    body { text-align: center; font-family: Arial, sans-serif; }
    #formulario {
      position: relative;
      display: inline-block;
    }
    #formulario img {
      width: 600px; /* ajuste conforme o tamanho da sua imagem */
    }
    #formulario input {
      position: absolute;
      width: 80px;
      padding: 4px;
      border: 1px solid #333;
      border-radius: 4px;
    }
    /* Ajuste a posição dos campos conforme necessário */
    #campoD { top: 200px; left: 100px; }
    #campoI { top: 200px; left: 200px; }
    canvas {
      position: absolute;
      top: 0; left: 0;
    }
    #botoes {
      margin-top: 20px;
    }
    button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Formulário de Avaliação da Dor</h2>
  <p>Digite nos campos e desenhe sobre o corpo para indicar a dor.</p>

  <div id="formulario">
    <!-- Substitua pelo nome correto da sua imagem -->
    <img src="formulario.png" alt="Formulário de Dor">
    
    <!-- Campos de texto -->
    <input id="campoD" type="text" placeholder="D:">
    <input id="campoI" type="text" placeholder="I:">
    
    <!-- Área de desenho -->
    <canvas id="canvas" width="600" height="800"></canvas>
  </div>

  <div id="botoes">
    <button onclick="limparCanvas()">Limpar desenho</button>
    <button onclick="salvarPDF()">Salvar em PDF</button>
  </div>

  <!-- Bibliotecas externas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let desenhando = false;

    canvas.addEventListener('mousedown', () => desenhando = true);
    canvas.addEventListener('mouseup', () => desenhando = false);
    canvas.addEventListener('mousemove', desenhar);

    function desenhar(e) {
      if (!desenhando) return;
      ctx.fillStyle = "red"; // cor do desenho
      ctx.beginPath();
      ctx.arc(e.offsetX, e.offsetY, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Função para limpar o desenho
    function limparCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Função para salvar em PDF
    async function salvarPDF() {
      const { jsPDF } = window.jspdf;
      const formulario = document.getElementById('formulario');
      const canvasImagem = await html2canvas(formulario);
      const imgData = canvasImagem.toDataURL('image/png');

      const pdf = new jsPDF('p', 'mm', 'a4');
      const largura = pdf.internal.pageSize.getWidth();
      const altura = pdf.internal.pageSize.getHeight();
      pdf.addImage(imgData, 'PNG', 0, 0, largura, altura);
      pdf.save("formulario_dor.pdf");
    }
  </script>
</body>
</html>
