<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mapa da Dor</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/gifshot@0.3.2/build/gifshot.min.js"></script>

<div class="app">

  <h1>Mapa da Dor</h1>

  <!-- ✅ CAMPO CORRETO DO PACIENTE (USADO NO JS) -->
  <input
    type="text"
    id="nomePaciente"
    placeholder="Nome do paciente"
  >

  <div class="botoes">

    <button id="btnGIF" onclick="salvarGIF()">GIF</button>

    <button id="btnPintar" onclick="definirModo('pintar')">
      Pintar
    </button>

    <button id="btnApagar" onclick="definirModo('apagar')">
      Apagar
    </button>

    <button id="btnLimpar" onclick="limparTudo()">
      Limpar
    </button>

    <button id="btnPDF" onclick="salvarPDF()">
      PDF
    </button>

    <button onclick="zoomMenos()">-</button>

    <button onclick="zoomMais()">+</button>

  </div>

  <div id="mapaWrapper">

    <div id="mapaContainer">

      <canvas id="canvasBase"></canvas>

      <canvas id="canvasPaint"></canvas>

      <div id="formulario"></div>

      <!-- 📌 RODAPÉ (NÃO MEXER AQUI) -->
      <div id="rodapeInfo">

        <div class="linhaRodape">
          <strong>Data:</strong>
          <input type="date" id="dataPreenchimento">
        </div>

        <div class="linhaRodape">
          <strong>Paciente:</strong>
          <input type="text" id="nomeRodape">
        </div>

        <div class="linhaRodape assinatura">
          <strong>Assinatura:</strong>
          <input type="text" id="assinatura">
        </div>

      </div>

    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
