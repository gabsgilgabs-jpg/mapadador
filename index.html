<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mapa de Dor</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <!-- CABEÇALHO -->
  <header id="cabecalho">

    <h2>
      Mapa de Dor Corporal
    </h2>

    <p>
      Registro clínico de avaliação do paciente
    </p>

  </header>

  <!-- DADOS PACIENTE -->
  <div id="dadosPaciente">

    <input
      type="text"
      id="nome"
      placeholder="Nome do paciente"
      class="campoNome"
      autocomplete="off"
    >

    <input
      type="date"
      id="dataPreenchimento"
      class="campoData"
    >

    <input
      type="text"
      id="assinatura"
      placeholder="Assinatura"
      class="campoAssinatura"
      autocomplete="off"
    >

  </div>

  <!-- MAPA -->
  <div id="containerPai">

    <div id="mapaContainer">

      <!-- IMAGEM -->
      <canvas id="canvasBase"></canvas>

      <!-- DESENHO -->
      <canvas id="canvasPaint"></canvas>

      <!-- CAMPOS -->
      <div id="formulario"></div>

    </div>

  </div>

  <!-- BOTÕES -->
  <div class="botoes">

    <button
      id="btnParar"
      class="botaoAtivo"
      onclick="desativarModo()"
      type="button"
    >
      Parar desenho
    </button>

    <button
      id="btnPintar"
      onclick="definirModo('pintar')"
      type="button"
    >
      Pintar
    </button>

    <button
      id="btnApagar"
      onclick="definirModo('apagar')"
      type="button"
    >
      Apagar
    </button>

    <button
      onclick="limparTudo()"
      type="button"
    >
      Limpar
    </button>

    <button
      onclick="salvarPDF()"
      type="button"
    >
      PDF
    </button>

    <button
      onclick="salvarGIF()"
      type="button"
    >
      GIF
    </button>

    <button
      onclick="zoomMais()"
      type="button"
    >
      +
    </button>

    <button
      onclick="zoomMenos()"
      type="button"
    >
      -
    </button>

    <button
      onclick="resetZoom()"
      type="button"
    >
      100%
    </button>

  </div>

  <!-- OBSERVAÇÕES -->
  <section id="observacoes">

    <p class="textoObs">

      Obs.: indique com flechas os locais a que se referem o início (D)
      e a intensidade (I) das dores acima.
      Marque com um círculo o local da sua principal queixa de dor.

    </p>

    <!-- PERGUNTA 1 -->
    <div class="pergunta">

      <label>
        1. Descreva o que piora ou produz a sua dor:
      </label>

      <textarea
        rows="5"
        placeholder="Digite aqui..."
      ></textarea>

    </div>

    <!-- PERGUNTA 2 -->
    <div class="pergunta">

      <label>
        2. Descreva o que melhora a sua dor:
      </label>

      <textarea
        rows="5"
        placeholder="Digite aqui..."
      ></textarea>

    </div>

    <!-- PERGUNTA 3 -->
    <div class="pergunta">

      <label>
        3. A sua dor é constante?
      </label>

      <div class="opcoes">

        <label>

          <input
            type="radio"
            name="dorConstante"
          >

          Sim

        </label>

        <label>

          <input
            type="radio"
            name="dorConstante"
          >

          Não

        </label>

      </div>

    </div>

  </section>

  <!-- RODAPÉ -->
  <footer id="rodape">

    <div class="rodapeCampos">

      <div class="rodapeItem">

        <label>
          Data:
        </label>

        <input type="date">

      </div>

      <div class="rodapeItem nomeRodape">

        <label>
          Nome:
        </label>

        <input
          type="text"
          autocomplete="off"
        >

      </div>

      <div class="rodapeItem assinaturaRodape">

        <label>
          Assinatura:
        </label>

        <input
          type="text"
          autocomplete="off"
        >

      </div>

    </div>

    <p class="textoRodape">
      Sistema de Avaliação de Dor • Registro clínico seguro
    </p>

  </footer>

  <!-- LIBS -->
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- SCRIPT -->
  <script src="script.js"></script>

</body>
</html>
