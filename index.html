<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mapa da Dor</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <h1>Mapa da Dor</h1>

  <div class="topo">

    <input
      type="text"
      id="nomePaciente"
      placeholder="Nome do paciente"
    >

    <div class="botoes">

      <button onclick="definirModo('pintar')">
        Pintar
      </button>

      <button onclick="definirModo('apagar')">
        Apagar
      </button>

      <button onclick="limparTudo()">
        Limpar
      </button>

      <button onclick="salvarPDF()">
        PDF
      </button>

    </div>

  </div>

  <div id="mapaContainer">

    <canvas id="canvasBase"></canvas>

    <canvas id="canvasPaint"></canvas>

    <div id="formulario"></div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script src="script.js"></script>

</body>
</html>
